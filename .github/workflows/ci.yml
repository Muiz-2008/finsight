name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+psycopg://finsight:finsight@localhost:5432/finsight

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Dependency vulnerability audit (pip-audit)
        # Informational, not blocking: as of this writing pip-audit flags
        # one transitive dependency (ecdsa, pulled in by python-jose) with
        # a known, currently-unfixed timing-attack CVE. It doesn't affect
        # this app — JWTs are signed with HS256, never the ECDSA
        # algorithms that vulnerability targets — but failing the build on
        # a vulnerability with no available fix would just train everyone
        # to ignore red CI. New/fixable vulnerabilities still show up here
        # for a human to triage.
        run: pip-audit --desc || true
