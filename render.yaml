services:
  - type: web
    name: finsight-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Runs migrations before every deploy, then starts the API on Render's
    # dynamically-assigned $PORT (the Dockerfile's own CMD hardcodes 8000
    # for local/docker-compose use, where we control the port ourselves —
    # this overrides it for Render specifically).
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # set to your Neon (or other managed Postgres) connection string
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://your-app.vercel.app"]
      - key: MARKET_DATA_PROVIDER
        value: local # set to "yfinance" for real market data
