services:
  - type: web
    name: finsight-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # No dockerCommand override here on purpose: backend/docker-entrypoint.sh
    # (the Dockerfile's CMD) already runs migrations then starts uvicorn on
    # $PORT, so behavior is identical between Render and local Docker
    # Compose — one script, not a YAML string that has to match it.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://your-app.vercel.app"]
      - key: MARKET_DATA_PROVIDER
        value: local # set to "yfinance" for real market data

databases:
  - name: finsight-db
    databaseName: finsight
    user: finsight
    plan: free
