<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinSight</title>
    <script>
      // Applied synchronously, before first paint, so a returning user who
      // chose "dark" doesn't see a flash of the light theme while React
      // mounts and useTheme's effect catches up. Kept intentionally tiny
      // and defensive (try/catch) — this runs before any error boundary
      // exists to catch a thrown exception.
      try {
        var t = localStorage.getItem("finsight_theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
